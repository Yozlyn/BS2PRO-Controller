name: build-windows

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      build_type:
        description: Build type
        required: true
        default: ci
        type: choice
        options:
          - ci
          - prerelease
          - release
      version:
        description: Optional version override
        required: false
        default: ""
      create_release:
        description: Create GitHub release
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    env:
      GO_VERSION: "1.26.1"
      NODE_VERSION: "20"
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Wails
        shell: pwsh
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Setup go-winres
        shell: pwsh
        run: go install github.com/tc-hib/go-winres@latest

      - name: Setup NSIS
        shell: pwsh
        run: choco install nsis -y

      - name: Resolve version
        id: meta
        shell: pwsh
        run: |
          $wails = Get-Content -Raw -Encoding UTF8 "wails.json" | ConvertFrom-Json
          $baseVersion = [string]$wails.info.productVersion
          $versionPrefix = $baseVersion -replace '-r\d+$', ''
          $inputBuildType = "${{ github.event.inputs.build_type }}"
          $inputVersion = "${{ github.event.inputs.version }}"
          $dateSuffix = Get-Date -Format "yyyyMMdd"
          $commitSuffix = (git rev-parse --short HEAD).Trim()

          if ([string]::IsNullOrWhiteSpace($inputBuildType)) {
            $buildType = "ci"
          } else {
            $buildType = $inputBuildType.Trim().ToLowerInvariant()
          }

          if (-not [string]::IsNullOrWhiteSpace($inputVersion)) {
            $finalVersion = $inputVersion.Trim()
          } else {
            switch ($buildType) {
              "release" {
                $finalVersion = $baseVersion
              }
              "prerelease" {
                $finalVersion = "$baseVersion-$dateSuffix-pre"
              }
              default {
                $finalVersion = "$versionPrefix-$commitSuffix"
              }
            }
          }

          $releaseTag = $finalVersion
          $artifactName = "BS2PRO-Controller-$finalVersion-windows-amd64"
          $installerName = "BS2PRO-Controller-$finalVersion-windows-amd64-installer.exe"

          "base_version=$baseVersion" >> $env:GITHUB_OUTPUT
          "build_type=$buildType" >> $env:GITHUB_OUTPUT
          "final_version=$finalVersion" >> $env:GITHUB_OUTPUT
          "release_tag=$releaseTag" >> $env:GITHUB_OUTPUT
          "artifact_name=$artifactName" >> $env:GITHUB_OUTPUT
          "installer_name=$installerName" >> $env:GITHUB_OUTPUT

      - name: Apply version to wails.json
        shell: pwsh
        run: |
          $path = "wails.json"
          $json = Get-Content -Raw -Encoding UTF8 $path | ConvertFrom-Json
          $json.info.productVersion = "${{ steps.meta.outputs.final_version }}"
          $content = $json | ConvertTo-Json -Depth 100
          $utf8 = New-Object System.Text.UTF8Encoding($false)
          [System.IO.File]::WriteAllText((Resolve-Path $path), $content + [Environment]::NewLine, $utf8)

      - name: Install frontend dependencies
        shell: cmd
        run: |
          cd frontend
          npm install

      - name: Build
        shell: pwsh
        run: ./scripts/build.ps1

      - name: Collect artifacts
        shell: pwsh
        run: |
          $artifactDir = Join-Path "artifacts" "${{ steps.meta.outputs.artifact_name }}"
          New-Item -ItemType Directory -Force -Path $artifactDir | Out-Null

          $installerSource = "build/bin/BS2PRO-Controller-amd64-installer.exe"
          $installerTarget = Join-Path $artifactDir "${{ steps.meta.outputs.installer_name }}"

          if (Test-Path $installerSource) {
            Copy-Item $installerSource $installerTarget -Force
          }

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.meta.outputs.artifact_name }}
          path: artifacts/${{ steps.meta.outputs.artifact_name }}
          if-no-files-found: error

      - name: Build release commit notes
        id: release_notes
        if: github.event_name == 'workflow_dispatch' && steps.meta.outputs.build_type != 'ci' && github.event.inputs.create_release == 'true'
        shell: pwsh
        run: |
          $buildType = "${{ steps.meta.outputs.build_type }}"
          $currentTag = "${{ steps.meta.outputs.release_tag }}"

          git fetch --tags --force

          $releaseTags = git tag --list "2.*-r*" --sort=-version:refname
          $allTags = git tag --list "v*" --sort=-version:refname
          $previousTag = $null

          if ($buildType -eq "release") {
            foreach ($tag in $releaseTags) {
              if ($tag -eq $currentTag) { continue }
              if ($tag -match '-pre$') { continue }
              $previousTag = $tag
              break
            }
          } else {
            foreach ($tag in $allTags) {
              if ($tag -eq $currentTag) { continue }
              $previousTag = $tag
              break
            }
          }

          if ([string]::IsNullOrWhiteSpace($previousTag)) {
            $commitSubjects = @(git log --pretty=format:"%s")
          } else {
            $commitSubjects = @(git log --pretty=format:"%s" "$previousTag..HEAD")
          }

          $commitSubjects = @(
            $commitSubjects |
              ForEach-Object { $_.Trim() } |
              Where-Object { -not [string]::IsNullOrWhiteSpace($_) }
          )

          if ($commitSubjects.Count -eq 0) {
            $commits = "- No changes."
          } else {
            $commits = ($commitSubjects | ForEach-Object { "- $_" }) -join [Environment]::NewLine
          }

          $notesPath = Join-Path $env:RUNNER_TEMP "release-notes.txt"
          $utf8 = New-Object System.Text.UTF8Encoding($false)
          [System.IO.File]::WriteAllText($notesPath, $commits + [Environment]::NewLine, $utf8)

          "previous_tag=$previousTag" >> $env:GITHUB_OUTPUT
          "notes_path=$notesPath" >> $env:GITHUB_OUTPUT

      - name: Create or update tag
        if: github.event_name == 'workflow_dispatch' && steps.meta.outputs.build_type != 'ci' && github.event.inputs.create_release == 'true'
        shell: pwsh
        run: |
          $tag = "${{ steps.meta.outputs.release_tag }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f $tag
          git push origin refs/tags/$tag --force

      - name: Create GitHub release
        if: github.event_name == 'workflow_dispatch' && steps.meta.outputs.build_type != 'ci' && github.event.inputs.create_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.release_tag }}
          name: BS2PRO-Controller ${{ steps.meta.outputs.final_version }}
          prerelease: ${{ steps.meta.outputs.build_type == 'prerelease' }}
          body_path: ${{ steps.release_notes.outputs.notes_path }}
          fail_on_unmatched_files: false
          files: |
            artifacts/${{ steps.meta.outputs.artifact_name }}/${{ steps.meta.outputs.installer_name }}
