<!DOCTYPE html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BS2PRO Controller</title>
    <script>
      const themeKey = 'theme'
      const followSystemThemeKey = 'theme-follow-system'
      const followSystemTheme = localStorage.getItem(followSystemThemeKey) !== 'false'
      const storedTheme = localStorage.getItem(themeKey)
      const useDark = followSystemTheme
        ? window.matchMedia('(prefers-color-scheme: dark)').matches
        : storedTheme === 'dark'

      document.documentElement.classList.toggle('dark', useDark)
      document.documentElement.style.backgroundColor = useDark ? '#1f1f1f' : '#f8fafc'
    </script>
  </head>
  <body class="antialiased">
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
